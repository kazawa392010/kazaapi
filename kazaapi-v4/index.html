<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uri · KazaAPI v4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF1EE;
    --paper:#FBFBF9;
    --ink:#1C2321;
    --ink-soft:#5B6560;
    --line:#D8DDD6;
    --grid:#E2E7E0;

    --amused:#FF6B4A;
    --annoyed:#C1121F;
    --serious:#3B4CCA;
    --indifferent:#8D99AE;

    --accent:var(--amused);
    --accent-soft:#FFE4DB;

    --radius:14px;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'IBM Plex Sans', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:var(--font-body);
    color:var(--ink);
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0/28px 28px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/28px 28px,
      var(--bg);
    min-height:100vh;
  }

  /* ---------- layout ---------- */
  .shell{
    display:grid;
    grid-template-columns: 300px 1fr;
    max-width:1280px;
    margin:0 auto;
    min-height:100vh;
    gap:0;
  }
  @media (max-width: 860px){
    .shell{ grid-template-columns: 1fr; }
    .sidebar{ order:2; }
    .main{ order:1; }
  }

  .sidebar{
    padding:24px 20px;
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand-mark{
    width:38px; height:38px;
    border-radius:11px;
    background:var(--accent);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display);
    font-weight:700;
    color:white;
    font-size:18px;
    transition: background .5s ease;
    flex-shrink:0;
  }
  .brand-text h1{
    font-family:var(--font-display);
    font-size:19px;
    font-weight:700;
    margin:0;
    letter-spacing:-0.01em;
  }
  .brand-text p{
    margin:0;
    font-size:12px;
    color:var(--ink-soft);
    font-family:var(--font-mono);
  }

  /* health badge */
  .health{
    display:flex; align-items:center; gap:8px;
    font-family:var(--font-mono);
    font-size:11.5px;
    padding:9px 12px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
  }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--ink-soft); flex-shrink:0; }
  .dot.ok{ background:#2E9E4F; box-shadow:0 0 0 3px rgba(46,158,79,.15); }
  .dot.down{ background:var(--annoyed); box-shadow:0 0 0 3px rgba(193,18,31,.15); }
  .dot.pending{ background:#C99A2E; animation:pulse 1.4s infinite; }
  @keyframes pulse{ 50%{ opacity:.35; } }

  /* section blocks */
  .panel{
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--paper);
    padding:16px;
  }
  .panel h2{
    font-family:var(--font-display);
    font-size:12.5px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--ink-soft);
    margin:0 0 12px;
  }

  /* role switcher */
  .role-toggle{
    display:flex;
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  .role-toggle button{
    flex:1;
    border:none;
    background:transparent;
    padding:9px 6px;
    font-family:var(--font-mono);
    font-size:12px;
    cursor:pointer;
    color:var(--ink-soft);
    transition: all .15s ease;
  }
  .role-toggle button.active{
    background:var(--ink);
    color:white;
  }
  .kaza-token-field{
    margin-top:10px;
    display:none;
  }
  .kaza-token-field.show{ display:block; }

  input[type=text], input[type=password], textarea, select{
    width:100%;
    font-family:var(--font-mono);
    font-size:12.5px;
    padding:8px 10px;
    border-radius:8px;
    border:1px solid var(--line);
    background:white;
    color:var(--ink);
  }
  input:focus, textarea:focus, select:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  label.field-label{
    font-family:var(--font-mono);
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--ink-soft);
    display:block;
    margin:10px 0 4px;
  }
  label.field-label:first-child{ margin-top:0; }

  button.btn{
    font-family:var(--font-mono);
    font-size:12px;
    padding:8px 12px;
    border-radius:8px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:white;
    cursor:pointer;
  }
  button.btn.ghost{
    background:transparent;
    color:var(--ink);
  }
  button.btn:hover{ opacity:.85; }
  button.btn:disabled{ opacity:.4; cursor:not-allowed; }

  .row{ display:flex; gap:8px; }
  .row > *{ flex:1; }

  details summary{
    cursor:pointer;
    font-family:var(--font-mono);
    font-size:11.5px;
    color:var(--ink-soft);
    margin-bottom:8px;
  }

  .slider-row{ margin-bottom:10px; }
  .slider-row .val{ font-family:var(--font-mono); font-size:11px; color:var(--ink-soft); }
  input[type=range]{ width:100%; accent-color:var(--accent); }

  /* ---------- main / chat ---------- */
  .main{
    display:flex;
    flex-direction:column;
    height:100vh;
    position:sticky;
    top:0;
  }

  .chat-header{
    padding:18px 26px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(251,251,249,.85);
    backdrop-filter:blur(6px);
  }
  .mode-badge{
    font-family:var(--font-mono);
    font-size:11px;
    padding:4px 10px;
    border-radius:999px;
    border:1px solid var(--line);
    color:var(--ink-soft);
  }

  /* emotion meter — signature element: live stacked bar of Uri's mood */
  .emotion-meter{
    display:flex;
    height:7px;
    border-radius:99px;
    overflow:hidden;
    border:1px solid var(--line);
    width:180px;
  }
  .emotion-meter span{
    height:100%;
    transition: width .6s cubic-bezier(.4,0,.2,1);
  }
  .em-amused{ background:var(--amused); }
  .em-annoyed{ background:var(--annoyed); }
  .em-serious{ background:var(--serious); }
  .em-indifferent{ background:var(--indifferent); }
  .emotion-label{
    font-family:var(--font-mono);
    font-size:10.5px;
    color:var(--ink-soft);
    margin-top:5px;
    text-align:right;
  }

  .messages{
    flex:1;
    overflow-y:auto;
    padding:26px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .msg{
    max-width:72%;
    padding:12px 15px;
    border-radius:16px;
    font-size:14.5px;
    line-height:1.5;
    white-space:pre-wrap;
  }
  .msg.user{
    align-self:flex-end;
    background:var(--ink);
    color:white;
    border-bottom-right-radius:4px;
  }
  .msg.uri{
    align-self:flex-start;
    background:var(--paper);
    border:1px solid var(--line);
    border-left:3px solid var(--accent);
    border-bottom-left-radius:4px;
  }
  .msg.system{
    align-self:center;
    font-family:var(--font-mono);
    font-size:11.5px;
    color:var(--ink-soft);
    background:transparent;
    border:1px dashed var(--line);
  }
  .msg .provider-tag{
    display:block;
    font-family:var(--font-mono);
    font-size:9.5px;
    color:var(--ink-soft);
    margin-top:6px;
    text-transform:uppercase;
    letter-spacing:.05em;
  }

  .composer{
    border-top:1px solid var(--line);
    padding:16px 26px 22px;
    background:var(--paper);
  }
  .composer-row{
    display:flex;
    gap:10px;
    align-items:flex-end;
  }
  .composer textarea{
    resize:none;
    font-family:var(--font-body);
    font-size:14.5px;
    min-height:46px;
    max-height:140px;
    border-radius:12px;
    padding:12px 14px;
  }
  .composer .send-btn{
    height:46px;
    padding:0 20px;
    border-radius:12px;
    font-family:var(--font-display);
    font-weight:600;
  }
  .hint{
    font-family:var(--font-mono);
    font-size:10.5px;
    color:var(--ink-soft);
    margin-top:8px;
  }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:99px; }
</style>
</head>
<body>

<div class="shell">
  <!-- ============================= SIDEBAR ============================= -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" id="brandMark">U</div>
      <div class="brand-text">
        <h1>Uri</h1>
        <p>KazaAPI v4</p>
      </div>
    </div>

    <div class="health" id="healthBadge">
      <span class="dot pending" id="healthDot"></span>
      <span id="healthText">checking backend…</span>
    </div>

    <!-- Backend URL -->
    <div class="panel">
      <h2>Backend</h2>
      <label class="field-label">API base URL</label>
      <input type="text" id="backendUrl" placeholder="https://your-service.onrender.com">
      <button class="btn ghost" id="saveBackend" style="margin-top:8px; width:100%;">Save &amp; ping</button>
    </div>

    <!-- Role switcher -->
    <div class="panel">
      <h2>Role</h2>
      <div class="role-toggle">
        <button id="roleStranger" class="active">stranger</button>
        <button id="roleKaza">kaza</button>
      </div>
      <div class="kaza-token-field" id="tokenField">
        <label class="field-label">X-Kaza-Token</label>
        <input type="password" id="kazaToken" placeholder="your KAZA_ACCESS_TOKEN">
      </div>
    </div>

    <!-- Settings -->
    <div class="panel">
      <h2>Settings</h2>
      <details open>
        <summary>Personality sliders (kaza only)</summary>
        <div class="slider-row">
          <label class="field-label">Sassiness <span class="val" id="sassinessVal">0.7</span></label>
          <input type="range" min="0" max="1" step="0.05" value="0.7" id="sassiness">
        </div>
        <div class="slider-row">
          <label class="field-label">Task-mode formality <span class="val" id="formalityVal">0.8</span></label>
          <input type="range" min="0" max="1" step="0.05" value="0.8" id="formality">
        </div>
        <button class="btn ghost" id="saveConfig" style="width:100%;">Save to /api/v1/config</button>
      </details>
    </div>

    <div class="panel">
      <h2>Session</h2>
      <label class="field-label">Session ID</label>
      <input type="text" id="sessionId" readonly>
      <div class="row" style="margin-top:8px;">
        <button class="btn ghost" id="newSession">New</button>
        <button class="btn ghost" id="resetSession">Reset</button>
      </div>
    </div>
  </aside>

  <!-- ============================== MAIN =============================== -->
  <main class="main">
    <div class="chat-header">
      <div>
        <span class="mode-badge" id="modeBadge">mode: casual</span>
      </div>
      <div>
        <div class="emotion-meter" id="emotionMeter">
          <span class="em-amused" style="width:25%"></span>
          <span class="em-annoyed" style="width:25%"></span>
          <span class="em-serious" style="width:25%"></span>
          <span class="em-indifferent" style="width:25%"></span>
        </div>
        <div class="emotion-label" id="emotionLabel">amused · annoyed · serious · indifferent</div>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="msg system">Set your backend URL in the sidebar to start chatting with Uri.</div>
    </div>

    <div class="composer">
      <div class="composer-row">
        <textarea id="composerInput" placeholder="Nhắn gì đó cho Uri…" rows="1"></textarea>
        <button class="btn send-btn" id="sendBtn">Send</button>
      </div>
      <div class="hint" id="statusHint">idle</div>
    </div>
  </main>
</div>

<script>
(function(){
  "use strict";

  const state = {
    backendUrl: "",
    role: "stranger",
    kazaToken: "",
    sessionId: genSessionId(),
  };

  function genSessionId(){
    return "sess-" + Math.random().toString(36).slice(2, 10);
  }

  // ---- element refs ----
  const el = {
    backendUrl: document.getElementById("backendUrl"),
    saveBackend: document.getElementById("saveBackend"),
    healthDot: document.getElementById("healthDot"),
    healthText: document.getElementById("healthText"),
    roleStranger: document.getElementById("roleStranger"),
    roleKaza: document.getElementById("roleKaza"),
    tokenField: document.getElementById("tokenField"),
    kazaToken: document.getElementById("kazaToken"),
    sessionId: document.getElementById("sessionId"),
    newSession: document.getElementById("newSession"),
    resetSession: document.getElementById("resetSession"),
    messages: document.getElementById("messages"),
    composerInput: document.getElementById("composerInput"),
    sendBtn: document.getElementById("sendBtn"),
    statusHint: document.getElementById("statusHint"),
    modeBadge: document.getElementById("modeBadge"),
    emotionMeter: document.getElementById("emotionMeter"),
    emotionLabel: document.getElementById("emotionLabel"),
    brandMark: document.getElementById("brandMark"),
    sassiness: document.getElementById("sassiness"),
    sassinessVal: document.getElementById("sassinessVal"),
    formality: document.getElementById("formality"),
    formalityVal: document.getElementById("formalityVal"),
    saveConfig: document.getElementById("saveConfig"),
  };

  el.sessionId.value = state.sessionId;

  // ---- backend url / health ----
  el.saveBackend.addEventListener("click", () => {
    state.backendUrl = el.backendUrl.value.trim().replace(/\/+$/, "");
    checkHealth();
  });

  async function checkHealth(){
    if (!state.backendUrl){
      setHealth("down", "no backend url set");
      return;
    }
    setHealth("pending", "checking…");
    try{
      const res = await fetch(state.backendUrl + "/healthz");
      if (res.ok){
        setHealth("ok", "backend online");
      } else {
        setHealth("down", "backend error " + res.status);
      }
    } catch(e){
      setHealth("down", "unreachable");
    }
  }

  function setHealth(status, text){
    el.healthDot.className = "dot " + status;
    el.healthText.textContent = text;
  }

  // ---- role switcher ----
  function setRole(role){
    state.role = role;
    el.roleStranger.classList.toggle("active", role === "stranger");
    el.roleKaza.classList.toggle("active", role === "kaza");
    el.tokenField.classList.toggle("show", role === "kaza");
  }
  el.roleStranger.addEventListener("click", () => setRole("stranger"));
  el.roleKaza.addEventListener("click", () => setRole("kaza"));
  el.kazaToken.addEventListener("input", () => { state.kazaToken = el.kazaToken.value; });

  // ---- session controls ----
  el.newSession.addEventListener("click", () => {
    state.sessionId = genSessionId();
    el.sessionId.value = state.sessionId;
    el.messages.innerHTML = "";
    addSystemMsg("New session started.");
  });

  el.resetSession.addEventListener("click", async () => {
    if (!state.backendUrl) return;
    try{
      await fetch(`${state.backendUrl}/api/v1/chat/reset?session_id=${encodeURIComponent(state.sessionId)}`, {
        method: "POST",
        headers: authHeaders(),
      });
      el.messages.innerHTML = "";
      addSystemMsg("Session memory cleared.");
    } catch(e){
      addSystemMsg("Could not reset session: " + e.message);
    }
  });

  // ---- personality sliders ----
  el.sassiness.addEventListener("input", () => el.sassinessVal.textContent = el.sassiness.value);
  el.formality.addEventListener("input", () => el.formalityVal.textContent = el.formality.value);

  el.saveConfig.addEventListener("click", async () => {
    if (!state.backendUrl) return;
    try{
      const res = await fetch(`${state.backendUrl}/api/v1/config`, {
        method: "PUT",
        headers: { "Content-Type": "application/json", ...authHeaders() },
        body: JSON.stringify({
          personality: {
            sassiness: parseFloat(el.sassiness.value),
            formality_in_task_mode: parseFloat(el.formality.value),
            proactivity: 0.3,
          },
          tool_toggles: {},
          api_keys: {},
        }),
      });
      if (res.status === 403){
        addSystemMsg("Config save rejected — enter a valid kaza token first.");
      } else if (res.ok){
        addSystemMsg("Personality saved.");
      } else {
        addSystemMsg("Config save failed: " + res.status);
      }
    } catch(e){
      addSystemMsg("Config save error: " + e.message);
    }
  });

  // ---- auth headers ----
  function authHeaders(){
    const headers = {};
    if (state.role === "kaza" && state.kazaToken){
      headers["X-Kaza-Token"] = state.kazaToken;
    }
    return headers;
  }

  // ---- message rendering ----
  function addUserMsg(text){
    const div = document.createElement("div");
    div.className = "msg user";
    div.textContent = text;
    el.messages.appendChild(div);
    scrollToBottom();
  }

  function addSystemMsg(text){
    const div = document.createElement("div");
    div.className = "msg system";
    div.textContent = text;
    el.messages.appendChild(div);
    scrollToBottom();
  }

  function startUriMsg(){
    const div = document.createElement("div");
    div.className = "msg uri";
    div.textContent = "";
    el.messages.appendChild(div);
    scrollToBottom();
    return div;
  }

  function scrollToBottom(){
    el.messages.scrollTop = el.messages.scrollHeight;
  }

  // ---- emotion meter ----
  function updateEmotion(emotion){
    const spans = el.emotionMeter.querySelectorAll("span");
    spans[0].style.width = (emotion.amused * 100).toFixed(1) + "%";
    spans[1].style.width = (emotion.annoyed * 100).toFixed(1) + "%";
    spans[2].style.width = (emotion.serious * 100).toFixed(1) + "%";
    spans[3].style.width = (emotion.indifferent * 100).toFixed(1) + "%";

    const dominant = Object.entries(emotion).sort((a,b) => b[1]-a[1])[0][0];
    el.emotionLabel.textContent =
      `amused ${(emotion.amused*100).toFixed(0)}% · annoyed ${(emotion.annoyed*100).toFixed(0)}% · ` +
      `serious ${(emotion.serious*100).toFixed(0)}% · indifferent ${(emotion.indifferent*100).toFixed(0)}%`;

    const colorVar = { amused:"--amused", annoyed:"--annoyed", serious:"--serious", indifferent:"--indifferent" }[dominant];
    document.documentElement.style.setProperty("--accent", `var(${colorVar})`);
  }

  // ---- send / SSE stream ----
  let sending = false;

  async function sendMessage(){
    const text = el.composerInput.value.trim();
    if (!text || sending) return;
    if (!state.backendUrl){
      addSystemMsg("Set a backend URL first.");
      return;
    }

    sending = true;
    el.sendBtn.disabled = true;
    el.statusHint.textContent = "sending…";
    addUserMsg(text);
    el.composerInput.value = "";
    autoGrow();

    const uriDiv = startUriMsg();
    let providerTag = null;

    try{
      const res = await fetch(`${state.backendUrl}/api/v1/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...authHeaders() },
        body: JSON.stringify({
          session_id: state.sessionId,
          message: text,
          role: state.role,
        }),
      });

      if (!res.ok || !res.body){
        uriDiv.textContent = `(error ${res.status} contacting Uri)`;
        sending = false; el.sendBtn.disabled = false; el.statusHint.textContent = "idle";
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true){
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream:true });

        const events = buffer.split("\n\n");
        buffer = events.pop(); // last (possibly incomplete) chunk stays in buffer

        for (const chunk of events){
          const lines = chunk.split("\n");
          let eventType = "message";
          let dataStr = "";
          for (const line of lines){
            if (line.startsWith("event:")) eventType = line.slice(6).trim();
            else if (line.startsWith("data:")) dataStr += line.slice(5).trim();
          }
          if (!dataStr) continue;
          let data;
          try{ data = JSON.parse(dataStr); } catch(e){ continue; }

          if (eventType === "meta"){
            el.modeBadge.textContent = "mode: " + data.mode;
            updateEmotion(data.emotion);
          } else if (eventType === "provider"){
            providerTag = data.name;
          } else if (eventType === "token"){
            uriDiv.textContent += data.text;
            scrollToBottom();
          } else if (eventType === "error"){
            addSystemMsg("⚠ " + data.message);
          } else if (eventType === "done"){
            if (providerTag){
              const tag = document.createElement("span");
              tag.className = "provider-tag";
              tag.textContent = "via " + providerTag;
              uriDiv.appendChild(tag);
            }
          }
        }
      }
    } catch(e){
      uriDiv.textContent = "(connection error: " + e.message + ")";
    }

    sending = false;
    el.sendBtn.disabled = false;
    el.statusHint.textContent = "idle";
  }

  el.sendBtn.addEventListener("click", sendMessage);
  el.composerInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });

  function autoGrow(){
    el.composerInput.style.height = "auto";
    el.composerInput.style.height = Math.min(el.composerInput.scrollHeight, 140) + "px";
  }
  el.composerInput.addEventListener("input", autoGrow);

  // ---- init ----
  setRole("stranger");
})();
</script>
</body>
</html>
